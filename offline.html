<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Không có mạng — SkinAI</title>
<meta name="robots" content="noindex">
<!-- Trang này được Service Worker cài sẵn từ lần đầu (precache) và hiển thị khi không có mạng
     và trang đang mở cũng chưa từng được tải về máy. CSS viết inline để luôn hiển thị được,
     không phụ thuộc file nào khác. -->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #ece4ef, #f7ede9);
    color: #2b2231; text-align: center;
  }
  .box { max-width: 380px; }
  .drop {
    width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 22px;
    background: linear-gradient(160deg, #f28a3c, #ee5f79 55%, #dd4f9c);
    display: grid; place-items: center; box-shadow: 0 10px 30px rgba(226,80,143,.35);
  }
  .drop svg { width: 34px; height: 34px; fill: #fff; }
  h1 { font-size: 1.3rem; margin: 0 0 8px; }
  p { color: #5d5368; font-size: 0.92rem; line-height: 1.5; margin: 0 0 20px; }
  button {
    font: inherit; font-weight: 700; padding: 11px 22px; border-radius: 999px; border: 0;
    background: linear-gradient(160deg, #f28a3c, #ee5f79 55%, #dd4f9c); color: #fff; cursor: pointer;
    box-shadow: 0 8px 22px rgba(226,80,143,.32);
  }
  @media (prefers-color-scheme: dark) {
    body { background: linear-gradient(160deg, #241f29, #2a211f); color: #f1ecf3; }
    p { color: #c9c0d1; }
  }
</style>
</head>
<body>
  <div class="box">
    <div class="drop" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 2.5c3.6 4.3 6 7.6 6 10.9A6 6 0 0 1 6 13.4C6 10.1 8.4 6.8 12 2.5Z"/></svg>
    </div>
    <h1>Không có kết nối mạng</h1>
    <p>SkinAI cần kết nối Internet để phân tích da và đồng bộ lịch sử. Trang bạn vừa mở chưa được tải về máy trước đó nên chưa thể xem ngoại tuyến. Hãy kiểm tra mạng rồi thử lại.</p>
    <button type="button" onclick="location.reload()">Thử lại</button>
  </div>
</body>
</html>
